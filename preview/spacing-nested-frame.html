<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;background:var(--eb-white);font-family:var(--eb-font-mono);padding:22px;color:var(--eb-text-dark)}
.wrap{display:flex;gap:24px;align-items:center}
.demo1{background:#FEFBF6;border:1px solid #5d3136;padding:6px}
.demo1 .inner{background:#F9ECDF;border:1px solid #A2777A;padding:3px}
.demo1 .btn{background:none;border:1px solid #A2777A;padding:8px 30px 8px 10px;font-family:inherit;display:flex;flex-direction:column;gap:2px}
.demo1 .t{font-size:12px;font-weight:700;text-transform:uppercase;color:#5d3136}
.demo1 .s{font-size:6px;letter-spacing:1px;text-transform:uppercase;color:#A2777A}
.notes{font-size:9px;color:#7D5658;line-height:1.7;max-width:300px}
.notes b{color:#5d3136}
</style></head><body>
<div class="wrap">
  <div class="demo1"><div class="inner"><div class="btn"><span class="t">START A CONVERSATION</span><span class="s">theceo@eduba.io</span></div></div></div>
  <div class="notes">
    <b>Nested 1px borders.</b><br>
    outer <code>#5D3136</code> · middle &amp; inner <code>#A2777A</code><br>
    padding: 5 · 2 · 5 · 28<br>
    No radius. No shadow.
  </div>
</div>
</body></html>

<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;background:var(--eb-white);font-family:var(--eb-font-mono);padding:18px;color:var(--eb-text-dark)}
.row{display:flex;gap:0;align-items:stretch;border:1px solid var(--eb-light-pink)}
.sw{flex:1;padding:14px 10px 10px;display:flex;flex-direction:column;justify-content:space-between;min-height:100px;border-right:1px solid rgba(93,49,54,.15)}
.sw:last-child{border-right:none}
.sw .t{font-size:9px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.sw .h{font-size:10px;font-family:var(--eb-font-mono);margin-top:auto;opacity:.75}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#5d3136;color:#fefbf6"><span class="t">dark brown</span><span class="h">#5D3136</span></div>
  <div class="sw" style="background:#421D24;color:#fefbf6"><span class="t">deep wine</span><span class="h">#421D24</span></div>
  <div class="sw" style="background:#7B5A5C;color:#fefbf6"><span class="t">medium brown</span><span class="h">#7B5A5C</span></div>
  <div class="sw" style="background:#A2777A;color:#fefbf6"><span class="t">light brown</span><span class="h">#A2777A</span></div>
  <div class="sw" style="background:#D8BFC0"><span class="t">light pink</span><span class="h">#D8BFC0</span></div>
  <div class="sw" style="background:#EAD5D6"><span class="t">cream</span><span class="h">#EAD5D6</span></div>
  <div class="sw" style="background:#F9ECDF"><span class="t">skin</span><span class="h">#F9ECDF</span></div>
  <div class="sw" style="background:#FEFBF6;border:1px solid rgba(93,49,54,.15)"><span class="t">white</span><span class="h">#FEFBF6</span></div>
</div>
</body></html>

<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;background:var(--eb-white);font-family:var(--eb-font-mono);padding:18px;color:var(--eb-text-dark)}
.row{display:flex;align-items:flex-end;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(93,49,54,.12)}
.row:last-child{border-bottom:none}
.label{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#A2777A;font-weight:700;width:60px}
.bar{background:#5d3136;height:14px}
.val{font-size:9px;opacity:.65;margin-left:auto}
</style></head><body>
<div class="row"><span class="label">2px</span><div class="bar" style="width:2px"></div><span class="val">2 · form inner</span></div>
<div class="row"><span class="label">4px</span><div class="bar" style="width:4px"></div><span class="val">4 · micro gap</span></div>
<div class="row"><span class="label">8px</span><div class="bar" style="width:8px"></div><span class="val">8 · default gap</span></div>
<div class="row"><span class="label">12px</span><div class="bar" style="width:12px"></div><span class="val">12 · frame padding</span></div>
<div class="row"><span class="label">20px</span><div class="bar" style="width:20px"></div><span class="val">20 · section pad</span></div>
<div class="row"><span class="label">40px</span><div class="bar" style="width:40px"></div><span class="val">40 · content padding</span></div>
<div class="row"><span class="label">60px</span><div class="bar" style="width:60px"></div><span class="val">60 · section gap</span></div>
</body></html>

<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;background:var(--eb-white);font-family:var(--eb-font-mono);padding:16px;color:var(--eb-text-dark)}
.row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid rgba(93,49,54,.12)}
.row:last-child{border-bottom:none}
.sw{width:44px;height:44px;flex:none;border:1px solid rgba(93,49,54,.15)}
.meta{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.name{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.desc{font-size:9px;color:#7D5658;letter-spacing:.02em}
.hex{font-size:9px;opacity:.7}
</style></head><body>
<div class="row"><div class="sw" style="background:#25ca58"></div><div class="meta"><span class="name">Live dot</span><span class="desc">The only saturated color. 5×5px, blinking, top-right nav only.</span></div><span class="hex">#25CA58</span></div>
<div class="row"><div class="sw" style="background:#4A2C2A"></div><div class="meta"><span class="name">Text dark</span><span class="desc">Body copy on surface.</span></div><span class="hex">#4A2C2A</span></div>
<div class="row"><div class="sw" style="background:#7D5658"></div><div class="meta"><span class="name">Subtitle</span><span class="desc">Muted secondary text.</span></div><span class="hex">#7D5658</span></div>
<div class="row"><div class="sw" style="background:#A2777A"></div><div class="meta"><span class="name">Light brown</span><span class="desc">Form labels, nested-border accent.</span></div><span class="hex">#A2777A</span></div>
</body></html>

<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;background:var(--eb-white);font-family:var(--eb-font-mono);padding:20px;color:var(--eb-text-dark)}
.form{max-width:320px;padding:6px 4px}
.hdr{text-align:center;padding:2px 0 6px;border-bottom:1px dashed rgba(93,49,54,.18);margin-bottom:7px}
.hdr span{font-size:8px;font-weight:700;letter-spacing:.12em;color:#A2777A}
.g{padding:0 2px 6px;border-bottom:1px dashed rgba(93,49,54,.12);margin-bottom:6px}
.g:last-of-type{border-bottom:none}
.l{display:block;font-size:7px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#A2777A;margin-bottom:4px}
.i{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(93,49,54,.2);padding:2px 0 3px;font-family:inherit;font-size:9px;color:#5d3136;outline:none}
.i:focus{border-bottom-color:#5d3136}
</style></head><body>
<div class="form">
<div class="hdr"><span>(compose_message)</span></div>
<div class="g"><label class="l">From ················</label><input class="i" value="your@email.com"/></div>
<div class="g"><label class="l">Message ············</label><input class="i" value="Write your message..."/></div>
</div>
</body></html>

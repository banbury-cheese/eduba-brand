<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;background:var(--eb-white);font-family:var(--eb-font-mono);padding:18px 20px;color:var(--eb-text-dark)}
.note{font-size:8px;letter-spacing:.12em;color:#A2777A;text-transform:uppercase;font-weight:700;margin-bottom:14px}
.wrap{display:flex;align-items:flex-end;gap:0;border-bottom:1px solid rgba(93,49,54,.15);padding-bottom:10px}
svg{max-width:100%;height:auto}
.cap{display:flex;gap:14px;margin-top:10px;font-size:8px;letter-spacing:.09em;text-transform:uppercase;color:#7D5658;font-weight:700}
.cap span{display:inline-flex;align-items:center;gap:4px}
.cap i{width:10px;height:10px;display:inline-block}
</style></head><body>
<div class="note">Wordmark · IBM Plex Mono 700 · gradient fill &amp; stroke</div>
<div class="wrap">
  <img src="../assets/wordmark.svg" style="width:100%;height:auto"/>
</div>
<div class="cap">
  <span><i style="background:linear-gradient(180deg,#5D4143,#492526)"></i>Fill gradient #5D4143 → #492526</span>
  <span><i style="background:linear-gradient(180deg,#F3C3C5,#8D7172)"></i>Stroke #F3C3C5 → #8D7172</span>
</div>
</body></html>

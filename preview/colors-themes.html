<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;background:#FEFBF6;font-family:'IBM Plex Mono', monospace;padding:18px;color:#4A2C2A}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.card{aspect-ratio:16/9;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.tab{font-size:8px;letter-spacing:.12em;font-weight:700;text-transform:uppercase;opacity:.8}
.title{font-size:14px;font-weight:700;text-transform:lowercase;font-family:var(--eb-font-primary)}
.hex{font-size:8px;letter-spacing:.05em}
</style></head><body>
<div class="grid">
  <div class="card" style="background:#D8BFC1;color:#5D3136"><span class="tab">THEME / ROSE</span><span class="title">rose</span><span class="hex">#D8BFC1</span></div>
  <div class="card" style="background:#7B5A5C;color:#FEFBF6"><span class="tab">THEME / MEDIUM</span><span class="title">medium brown</span><span class="hex">#7B5A5C</span></div>
  <div class="card" style="background:#FFFFFF;color:#5D3136;border:1px solid rgba(93,49,54,0.18)"><span class="tab">THEME / PAPER</span><span class="title">paper</span><span class="hex">#FFFFFF</span></div>
  <div class="card" style="background:#F9ECDF;color:#5D3136"><span class="tab">THEME / SKIN</span><span class="title">skin</span><span class="hex">#F9ECDF</span></div>
  <div class="card" style="background:#5D3136;color:#FEFBF6"><span class="tab">THEME / WINE</span><span class="title">dark wine</span><span class="hex">#5D3136</span></div>
</div>
</body></html>

<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;background:var(--eb-white);font-family:var(--eb-font-mono);padding:18px;color:var(--eb-text-dark)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{background:#5d3136;color:#FEFBF6;border:none;padding:7px 10px;font-size:8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-family:inherit;display:inline-flex;justify-content:space-between;align-items:center;gap:16px;min-width:130px}
.btn .a{font-size:12px}
.btn.ok{background:#1a9c43;justify-content:center}
.btn.ghost{background:#FEFBF6;color:#5d3136;border:1px solid #5d3136}
.btn.outer{background:none;border:none;padding:0}
.ticket{background:#F9ECDF;border:1px solid #A2777A;padding:1px}
.ticket .inner{background:#5d3136;color:#EAD5D6;border:1px solid #A2777A;padding:8px 20px;font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.lbl{font-size:8px;letter-spacing:.12em;color:#A2777A;font-weight:700;text-transform:uppercase;width:100%;margin-top:6px}
</style></head><body>
<div class="row">
  <button class="btn"><span>Send message</span><span class="a">→</span></button>
  <button class="btn ok">Message opened ✓</button>
  <button class="btn ghost"><span>View project</span><span class="a">→</span></button>
  <div class="ticket"><div class="inner">EMAIL US</div></div>
</div>
<div class="lbl">Buttons · IBM Plex Mono 800 · 8/12 caps · 0.12em</div>
</body></html>

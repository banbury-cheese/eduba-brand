name: Release

on:
  push:
    branches:
      - main

# Never run two releases against the same ref at once.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @eduba/ui
        run: pnpm --filter @eduba/ui build

      # npm auth for `changeset publish`. Written to the user .npmrc so the
      # committed project .npmrc stays clean (no ${NPM_TOKEN} placeholder that
      # warns on every local pnpm command).
      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # When changesets are pending, opens/updates a "Version Packages" PR that
      # bumps the version + writes packages/ui/CHANGELOG.md. When that PR merges
      # (no pending changesets, version ahead of npm), runs `release` to publish.
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
